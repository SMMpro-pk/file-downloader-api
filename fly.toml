app = "smmpro-file-downloader"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  API_BASE_PATH = "/api/v1"
  API_KEY_REQUIRED = "true"
  CORS_ORIGINS = "*"
  TRUST_PROXY = "true"
  REQUEST_TIMEOUT_MS = "10000"
  MAX_FILE_SIZE_BYTES = "1073741824"
  MAX_CONCURRENT_DOWNLOADS = "5"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/api/v1/health"
