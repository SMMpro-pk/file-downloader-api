services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smmpro-file-downloader
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - HOST=${HOST:-0.0.0.0}
      - API_KEY_REQUIRED=${API_KEY_REQUIRED:-false}
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - REQUEST_TIMEOUT_MS=${REQUEST_TIMEOUT_MS:-10000}
      - EXTRACT_TIMEOUT_MS=${EXTRACT_TIMEOUT_MS:-15000}
      - MAX_REDIRECTS=${MAX_REDIRECTS:-5}
      - MAX_EXTRACTED_LINKS=${MAX_EXTRACTED_LINKS:-50}
      - MAX_FILE_SIZE_BYTES=${MAX_FILE_SIZE_BYTES:-1073741824}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-32768}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-5}
      - DETECTION_RATE_LIMIT=${DETECTION_RATE_LIMIT:-30}
      - DOWNLOAD_RATE_LIMIT=${DOWNLOAD_RATE_LIMIT:-10}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_ARCHIVE_INSPECTION=${ENABLE_ARCHIVE_INSPECTION:-false}
    volumes:
      - smmpro-data:/usr/src/app/data
      - smmpro-tmp:/usr/src/app/tmp
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-3000}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - smmpro-network

volumes:
  smmpro-data:
  smmpro-tmp:

networks:
  smmpro-network:
    driver: bridge
